name: PR Validation

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.coderabbit.yaml'

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test tests/ServiceBusToolset.Application.Tests
          -c Release --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./test-results/**/*.trx

      - name: Generate coverage report
        if: success()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: ./test-results/**/coverage.cobertura.xml
          targetdir: ./coverage-report
          reporttypes: MarkdownSummaryGithub;TextSummary

      - name: Post coverage summary to PR
        if: success()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: ./coverage-report/SummaryGithub.md

      - name: Check coverage threshold
        if: success()
        run: |
          SUMMARY=$(cat ./coverage-report/Summary.txt)
          echo "$SUMMARY"
          LINE_COVERAGE=$(echo "$SUMMARY" | grep -i 'Line coverage' | grep -oP '[\d.]+(?=%)')
          echo "Line coverage: ${LINE_COVERAGE}%"
          THRESHOLD=60
          if (( $(echo "$LINE_COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Line coverage ${LINE_COVERAGE}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi
          echo "Coverage check passed: ${LINE_COVERAGE}% >= ${THRESHOLD}%"

  integration-tests:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run integration tests
        run: >
          dotnet test tests/ServiceBusToolset.Integration.Tests
          -c Release --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory ./test-results

      - name: Run CLI integration tests
        run: >
          dotnet test tests/ServiceBusToolset.CLI.Integration.Tests
          -c Release --no-build
          --logger "trx;LogFileName=cli-integration-tests.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./test-results/**/*.trx

  test-report:
    name: Publish Test Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()

    steps:
      - name: Download unit test results
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: ./test-results

      - name: Download integration test results
        uses: actions/download-artifact@v4
        with:
          name: integration-test-results
          path: ./test-results
        continue-on-error: true

      - name: Publish test report
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: ./test-results/**/*.trx
          reporter: dotnet-trx
